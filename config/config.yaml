# Novel Voice Cast 配置文件

# 小说文件
novel:
  text_path: "novels/novel.txt"        # 小说文本路径
  labels_path: "novels/labels.txt"     # 角色标注路径

# Issue #99 LLM stages use every non-empty key in config/sensenova_apikeys.
# Gender, emotion, and BGM are pinned to SenseNova Flash Lite with no fallback.
llm:
  provider: "sensenova"
  model: "sensenova-6.7-flash-lite"
  rate_limit_cooldown_seconds: 15

# 音色克隆引擎：voxcpm
clone_engine: "voxcpm"

# 预设 TTS 引擎（备用）
preset_engine: "pyttsx3"

# 角色音频配置
# 格式：角色名 → 参考音频路径
# 不配置的角色自动根据性别选择默认音频
characters:
  # 旁白 - 用深沉男声
  "旁白": "backend/data/presets/design_male_deep.wav"

  # 主角
  "罗伦斯": "backend/data/presets/demo_male.mp3"
  "劳伦斯": "backend/data/presets/demo_male.mp3"
  "赫萝": "backend/data/presets/holo_speech_only.wav"  # 提取语音部分，去掉静音

# 默认音频（根据性别）
default_audio:
  male: "backend/data/presets/design_elderly.wav"      # 其他男性
  female: "backend/data/presets/reference_speaker.wav"  # 其他女性

# 功能开关
features:
  gender_identify: true        # 自动识别性别
  emotion_label: true          # 情感标注（旁白跳过）
  performance_direction: true  # 逐句多 Agent 表演指导（VoxCPM 自然语言控制）
  denoise: false               # 音频去噪
  force_reprocess: false       # 强制重新处理情感标注（忽略已有结果）

# 输出配置
output:
  dir: "output"
  filename: "full_volume"
  format: "mp3"
  bitrate: "192k"  # 长篇成品保留足够的语音细节和 BGM 空间

# TTS 配置（VoxCPM）
voxcpm:
  # All narrator and character lines use voice cloning. Explicit character
  # references override the gender defaults above.
  force_all_characters: true
  model_path: "backend/models/VoxCPM2"
  module_path: "E:/projects/音色克隆/VoxCPM"
  python: "E:/projects/音色克隆/VoxCPM/.venv/python.exe"
  cfg_value: 2.0
  inference_timesteps: 10
  normalize: false
  reuse_reference_cache: true
  retry_badcase: true
  retry_badcase_max_times: 5
  retry_badcase_ratio_threshold: 3.0
  max_len: 4096
  # 每次失败都重新采样 VoxCPM；绝不再用 FFmpeg 拉伸成品语速。
  task_attempts: 7
  # 长句按语义标点拆分。每个短块独立生成、质检并写断点，最终再无损拼接。
  chunk_max_chars: 48
  chunk_min_chars: 8
  # VoxCPM 的控制词与正文共用输入；限制长度可显著降低把导演指令念出来的概率。
  control_max_chars: 32
  # 这里只拦截真正异常的高速样本。表演语速由 VoxCPM/导演控制，不强求命中估算时长。
  quality_min_duration_ratio: 0.55
  quality_max_duration_ratio: 1.9
  inter_chunk_pause_ms: 90
  timeout: 604800               # 最长允许连续运行 7 天

# VoxCPM 表演导演：emotion 之后、TTS 之前
# 每条 VoxCPM 台词均由两个互相盲审的导演独立分析，再由第三个 Agent 裁决。
streaming_tts:
  enabled: true
  checkpoint_path: "output/streaming_tts.checkpoint.json"
  log_path: "logs/streaming_tts.log"
  poll_interval_seconds: 15
  minimum_batch_size: 16
  maximum_batch_size: 4096
  maximum_batch_wait_seconds: 120

performance:
  output_path: "backend/data/performance_directions.json"
  checkpoint_path: "backend/data/performance_directions.checkpoint.json"
  profile_output_path: "backend/data/performance_profiles.json"
  profile_checkpoint_path: "backend/data/performance_profiles.checkpoint.json"
  # Lines belonging to speakers outside `characters` use a disjoint stream so
  # the existing primary checkpoint remains fully reusable and auditable.
  supplemental_output_path: "backend/data/performance_directions_supplemental.json"
  supplemental_checkpoint_path: "backend/data/performance_directions_supplemental.checkpoint.json"
  supplemental_profile_output_path: "backend/data/performance_profiles_supplemental.json"
  supplemental_profile_checkpoint_path: "backend/data/performance_profiles_supplemental.checkpoint.json"
  character_cards_path: "docs/角色卡.md"
  context_radius: 100
  min_control_chars: 18
  max_control_chars: 140
  max_agent_rounds: 8
  item_retries: 3
  force_profiles: false
  force_directions: false

# BGM 配置（Stage 7）
bgm:
  enabled: true                    # 是否启用 BGM
  force_segmentation: false        # 重新执行场景分割
  force_label: false               # 重新标注 BGM 类型
  force_generate: false            # 重新生成 BGM 音频
  segmentation_chunks: 24          # 更细的音乐场景，约每 12-24 个源行审视一次换乐
  # SFT + 5Hz LM 路径在本机实测退化为高度同质的节律噪声；恢复已验证能成曲的纯 DiT 路径。
  model: "acestep-v15-turbo"
  lm_model: "acestep-5Hz-lm-1.7B"
  thinking: false                   # 禁用语义音频码路径，直接由 DiT 生成完整音乐
  lm_backend: "vllm"               # Windows 不兼容时 ACE-Step 会自动退回 PyTorch
  cpu_offload: false                # turbo 在 12GB 显存可常驻；避免反复 CPU/GPU 搬运
  guidance_scale: 7.0
  clips_per_segment: 3
  clip_duration: 60                 # 每场景三条 60 秒变奏，显著减少短循环重复
  inference_steps: 8                # turbo 的原生采样步数（模型会忽略 CFG）
  clip_attempts: 3                  # 静音、截断或坏文件自动换 seed 重试
  proxy: "http://127.0.0.1:7890"   # 首次下载 ACE-Step 权重时使用
  generation_timeout: 1209600       # BGM 长跑最多 14 天
  volume_db: -8.0                  # BGM 全局音量（dB，负值越小越安静）

illustrations:
  plan_path: "output/illustration_plan.json"
  output_dir: "output/illustrations_local_portrait_7x9"
  checkpoint_path: "output/illustrations_local_portrait_7x9_checkpoint.json"
  prompt_audit_checkpoint_path: "backend/data/visual_prompt_audit.checkpoint.json"
  character_cards_path: "docs/角色卡.md"
  provider: "local-http"
  endpoint: "http://172.31.102.189:8000/generate"
  model: "local-image"
  size: "896x1152"
  composition_suffix: "vertical 7:9 portrait frame, balanced full-height composition, keep important faces and details clear of the lower subtitle-safe area"
  steps: 25
  cfg: 7.0
  seed: -1                         # 每次失败重新采样；成功图片由断点固定保留
  negative_prompt: "nsfw, nude, lowres, worst quality, low quality, blurry, bad anatomy, bad hands, extra fingers, missing fingers, deformed, duplicate, text, watermark, signature, logo"
  request_timeout: 900             # 单张图片最多等待 15 分钟
  max_attempts: 5
  interval_min: 0.0                # 本地/隧道接口无需限流等待
  interval_max: 0.0
  planning_timeout: 7200
  generation_timeout: 1209600      # 702 张图允许长跑 14 天
  prompt_audit_enabled: true       # 继续用 SenseNova 清理比喻幻觉并核对角色
  force_plan: false
  force_generate: false
  force_prompt_audit: false
  landscape:
    enabled: true
    size: "1280x720"               # 标准 16:9 横屏，像素量不高于当前竖图
    output_dir: "output/illustrations_local_landscape_16x9"
    checkpoint_path: "output/illustrations_local_landscape_16x9_checkpoint.json"
    composition_suffix: "cinematic 16:9 landscape frame, expand the environment horizontally, keep important faces and details clear of the lower subtitle-safe area"

video:
  # H3 成片使用独立文件名，保留已经完成的静态插画版作为可回退母版。
  output_path: "output/h3_continuous_portrait_7x9_subtitled.mp4"
  subtitle_path: "output/h3_continuous_portrait_7x9_subtitles.srt"
  ffmpeg: "D:/ffmpeg-7.1.1-full_build/bin/ffmpeg.exe"
  ffprobe: "D:/ffmpeg-7.1.1-full_build/bin/ffprobe.exe"
  subtitle_font: "SimHei"
  subtitle_font_size: 42            # 896x1152 竖屏上保持清晰可读
  max_subtitle_chars: 16
  max_subtitle_lines: 2
  fps: 25
  crf: 18                           # 高质量 H.264，低于默认 CRF 23
  preset: "slow"
  audio_bitrate: "256k"
  timeout: 172800
  force: false
  h3:
    enabled: true
    mode: "continuous-chain"         # 全时长动态覆盖；覆盖不足会失败，绝不以静帧补齐
    endpoint: "http://172.31.102.189:8189"
    output_dir: "output/h3_video_continuous" # 新目录，保留旧版 702 条片段与成片
    reuse_output_dir: "output/h3_video"      # 审核并复用旧版每个区间的首条动态镜头
    shot_plan_path: "backend/data/h3_shot_plan.json"
    visual_memory_path: "output/character_visual_memory.json" # 角色外貌、服装和阶段状态资产圣经
    minimum_duration: 5             # H3 官方优质训练区间下限
    maximum_duration: 10            # 质量优先；每条约需 15-20 分钟，最长可设 15
    max_chain_length: 3             # 最多连续续写 3 条，随后主动切镜重锚定以限制身份漂移
    max_freeze_ratio: 0.65          # 使用区间内最长近乎静止段不得超过 65%
    max_black_ratio: 0.20           # 使用区间内黑屏累计不得超过 20%
    min_anchor_similarity: 0.90     # I2VA/FL2VA 首尾锚点不匹配时自动换随机种子重试
    request_timeout: 60
    poll_seconds: 15
    job_timeout: 14400              # 单任务最多等待 4 小时；断网时保留 job_id
    max_attempts: 3                 # 服务明确失败后才换随机种子重提
    generation_timeout: 15552000    # 两种画幅的全书长跑最多 180 天
    render_timeout: 604800          # 本地混合分段与最终压制最多 7 天
    portrait:
      width: 672                    # 精确 7:9，宽高均为 16 的倍数
      height: 864
    landscape:
      width: 960
      height: 544
  landscape:
    enabled: true
    output_path: "output/h3_continuous_landscape_16x9_subtitled.mp4"
    subtitle_path: "output/h3_continuous_landscape_16x9_subtitles.srt"
    subtitle_font_size: 36
    max_subtitle_chars: 24
    max_subtitle_lines: 2
